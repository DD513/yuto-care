# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - test
  - security
  - quality
  - report

semgrep-scan:
  stage: quality
  image: returntocorp/semgrep:latest
  script:
    - semgrep --config=auto --json --output=semgrep-report.json .
    # 或使用特定規則集
    # - semgrep --config=p/security-audit --config=p/owasp-top-ten --json --output=semgrep-report.json .
    # 顯示結果
    - semgrep --config=auto --verbose .
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - semgrep-report.json
    expire_in: 30 days
    when: always
  allow_failure: true
  # only:
  #   - main
  #   - develop

# GitLab 內建掃描
include:
  # 靜態應用安全測試
  - template: Security/SAST.gitlab-ci.yml
  # Secret 檢測（偵測洩漏的密鑰）
  - template: Security/Secret-Detection.gitlab-ci.yml

# 自訂 SAST 變數（可選）
# sast:
#   variables:
#     SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, node_modules"
#     SAST_EXCLUDED_ANALYZERS: ""  # 排除特定分析器

# Trivy 檔案掃描（不需要 Docker-in-Docker）
trivy-fs:
  stage: security
  image: aquasec/trivy:latest
  before_script:
    - trivy --version
    - trivy fs --download-db-only
  script:
    # 掃描專案目錄的依賴漏洞
    - trivy fs 
        --format json 
        --output trivy-fs-report.json 
        --severity HIGH,CRITICAL 
        .
    
    # 顯示結果
    - trivy fs 
        --severity HIGH,CRITICAL 
        .
  
  artifacts:
    paths:
      - trivy-fs-report.json
    expire_in: 30 days
    when: always
  allow_failure: true

# 統整報告
security-report:
  stage: report
  image: debian:bookworm-slim
  
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends jq
  
  script:
    - echo "=== 安全掃描統計 ==="
    
    # Semgrep 統計
    - |
      if [ -f semgrep-report.json ]; then
        echo "Semgrep 發現問題數："
        jq '.results | length' semgrep-report.json || echo "0"
      fi
    
    # Trivy 統計
    - |
      if [ -f trivy-fs-report.json ]; then
        echo "📊 Trivy 檔案系統掃描結果："
        
        # 安全的方式處理可能的 null 值
        HIGH_CRITICAL=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy-fs-report.json 2>/dev/null || echo "0")
        
        TOTAL_VULN=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' trivy-fs-report.json 2>/dev/null || echo "0")
        
        echo "  高危漏洞數: $HIGH_CRITICAL"
        echo "  總漏洞數: $TOTAL_VULN"
        echo ""
      else
        echo "⚠️  未找到 Trivy 檔案系統報告"
        echo ""
      fi
  
  dependencies:
    - semgrep-scan
    - trivy-fs
  
  allow_failure: true